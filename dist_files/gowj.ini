; Gears of War: Judgment (recompilado para PC)
; iso: ruta al ISO del juego (Xbox 360). Vacio = se elige en el launcher
iso=
; datos: carpeta de partidas guardadas
datos=userdata
; mostrar_launcher: 1 = abrir el launcher al ejecutar GOWJ.exe
mostrar_launcher=1
; saltar_intro: 1 = saltar los logos del arranque
saltar_intro=1
; fps: 30 (original), 60, 120, 144 o sin_limite
fps=60
; panoramico: 16:9, 21:9, 32:9 o auto (proporcion del monitor)
panoramico=16:9
; resolucion: resolucion interna 1 (720p), 2 (1440p) o 3 (2160p)
resolucion=1
; ventana: tamano de la ventana (F11 o Alt+Intro = pantalla completa)
ventana=1280x720
pantalla_completa=0
; anisotropico: filtrado de texturas (0, 2, 4, 8 o 16)
anisotropico=16
; nitidez: 0 a 1 (enfoque al agrandar la imagen)
nitidez=0.5
; brillo: gamma final (1.0 = como la consola)
brillo=1.0
; idioma: es (latino), en, fr, de, it, pl, ru, ko, zh
idioma=es
mostrar_fps=0
